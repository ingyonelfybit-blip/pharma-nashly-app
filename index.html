<!DOCTYPE html>
<html lang="es-DO">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/pharma-nashly-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de farmacia: ventas, inventario, e-CF y contabilidad.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pharma Nashly">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pharma Nashly</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E7E8C">
  <style>
    /* Mientras arranca la app: la «N» de la marca, en claro u oscuro según el
       sistema. Se quita sola con el primer cuadro de Flutter. */
    :root { --fondo: #FCFDFD; --marca: #0E7E8C; --tinta: #616F75; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #12171A; --marca: #3FB5C4; --tinta: #8A979D; } }
    html, body { margin: 0; height: 100%; background: var(--fondo); }
    #arranque { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; font-family: system-ui, "Segoe UI", sans-serif; color: var(--tinta);
      transition: opacity .25s ease; }
    #arranque .n { width: 72px; height: 72px; }
    #arranque .barra { width: 140px; height: 3px; border-radius: 3px; overflow: hidden;
      background: color-mix(in srgb, var(--marca) 18%, transparent); }
    #arranque .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--marca);
      animation: ir 1.1s ease-in-out infinite; }
    @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #arranque .barra::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="arranque" role="status" aria-live="polite">
    <img class="n" src="icons/Icon-192.png" alt="" width="72" height="72">
    <div>Pharma Nashly</div>
    <div class="barra" aria-hidden="true"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // iPhone/iPad: Safari hace zoom solo al enfocar un campo con letra menor
    // de 16 px y no vuelve; la app quedaba agrandada y cortada a la derecha.
    // El motor de Flutter pone «maximum-scale=5.0»: se fija en 1 y se vigila
    // por si lo vuelve a poner. El zoom de Accesibilidad de iOS sigue andando.
    (function () {
      var VIEWPORT = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      function fijar() {
        var metas = document.querySelectorAll('meta[name=viewport]');
        if (!metas.length) {
          var m = document.createElement('meta');
          m.name = 'viewport';
          document.head.appendChild(m);
          metas = [m];
        }
        for (var i = 0; i < metas.length; i++) {
          if (metas[i].content !== VIEWPORT) metas[i].content = VIEWPORT;
        }
      }
      fijar();
      new MutationObserver(fijar).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
    // La pantalla de arranque se va con el primer cuadro de la app.
    window.addEventListener('flutter-first-frame', function () {
      var a = document.getElementById('arranque');
      if (!a) return;
      a.style.opacity = '0';
      setTimeout(function () { a.remove(); }, 300);
    });
    // La PWA: guarda la app en el navegador para abrir sin internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('pwa_sw.js').catch(function (e) {
          console.warn('Pharma Nashly: no se pudo activar el modo sin conexión', e);
        });
      });
    }
  </script>
</body>
</html>
